apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-pg
  namespace: sotetel
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg
      ports:
        - protocol: TCP
          port: 5432