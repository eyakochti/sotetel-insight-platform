apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-from-backend
  namespace: sotetel
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432