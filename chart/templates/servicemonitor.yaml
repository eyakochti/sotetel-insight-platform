{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /insight/actuator/prometheus
      interval: 30s
{{- end }}