apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sotetel-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: sotetel-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /insight
      backendRefs:
        - name: backend
          port: {{ .Values.backend.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: {{ .Values.frontend.port }}