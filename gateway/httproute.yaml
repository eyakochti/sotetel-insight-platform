apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sotetel-route
  namespace: sotetel-argo
spec:
  parentRefs:
    - name: sotetel-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /insight
      backendRefs:
        - name: backend
          port: 8089
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80